name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-mac/package-lock.json
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Install dependencies
        working-directory: agent-mac
        run: npm ci --no-audit --no-fund
      - name: Build preview
        working-directory: agent-mac
        run: npm run build
      - name: Verify hosting output
        working-directory: agent-mac
        run: npm run test:sites && npm run test:commerce
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: agent-mac/dist/client

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

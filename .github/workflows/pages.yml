name: Frontend checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: agent-mac/package-lock.json
      - name: Install dependencies
        working-directory: agent-mac
        run: npm ci --no-audit --no-fund
      - name: Build
        working-directory: agent-mac
        run: npm run build
      - name: Verify hosting output
        working-directory: agent-mac
        run: npm run test:sites && npm run test:commerce && npm run test:studio && npm run test:seo
